<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навчальний тренажер «PythonStart»</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-wrap">
            <div class="logo">
                <span>🐍</span>
                <span>PythonStart</span>
            </div>
            <nav class="nav-menu">
                <span style="font-size: 14px; color: var(--text-muted);">EduTech Innovators</span>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h1>Інтерактивний тренажер з основ Python</h1>
            <p>Опануйте базовий синтаксис мови програмування за 10 хвилин на день</p>
        </section>

        <!-- Topics Catalog -->
        <section id="catalog-section">
            <div id="topics-grid" class="topics-grid"></div>
        </section>

        <!-- Theory Section -->
        <section id="theory-section" class="hidden"></section>

        <!-- Quiz Section -->
        <section id="quiz-section" class="hidden"></section>
    </main>

    <script type="module" src="./src/js/app.js"></script>
</body>
</html>
